# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7f52c9153dfd83c8fa233f9cfb2a2700"
name = "shop-chat-agent"
application_url = "https://shopify-chat-app.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_customers,unauthenticated_read_product_listings,read_products,read_orders,customer_read_customers,customer_read_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://shopify-chat-app.onrender.com/api/auth"
]

[customer_authentication]
redirect_uris = [
  "https://shopify-chat-app.onrender.com/callback"
]
